			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "if [[ -f \"$PODS_ROOT/../.xcode.env\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env\"\nfi\nif [[ -f \"$PODS_ROOT/../.xcode.env.local\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env.local\"\nfi\n\n# The project root by default is one level up from the ios directory\nexport PROJECT_ROOT=\"$PROJECT_DIR\"/..\n\nif [[ \"$CONFIGURATION\" = *Debug* ]]; then\n  export SKIP_BUNDLING=1\nfi\nif [[ -z \"$ENTRY_FILE\" ]]; then\n  # Set the entry JS file using the bundler's entry resolution.\n  export ENTRY_FILE=\"$(\"$NODE_BINARY\" -e \"require('expo/scripts/resolveAppEntry')\" \"$PROJECT_ROOT\" ios absolute | tail -n 1)\"\nfi\n\nif [[ -z \"$CLI_PATH\" ]]; then\n  # Use Expo CLI\n  export CLI_PATH=\"$(\"$NODE_BINARY\" --print \"require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })\")\"\nfi\nif [[ -z \"$BUNDLE_COMMAND\" ]]; then\n  # Default Expo CLI command for bundling\n  export BUNDLE_COMMAND=\"export:embed\"\nfi\n\n# Source .xcode.env.updates if it exists to allow\n# SKIP_BUNDLING to be unset if needed\nif [[ -f \"$PODS_ROOT/../.xcode.env.updates\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env.updates\"\nfi\n# Source local changes to allow overrides\n# if needed\nif [[ -f \"$PODS_ROOT/../.xcode.env.local\" ]]; then\n  source \"$PODS_ROOT/../.xcode.env.local\"\nfi\n\n`\"$NODE_BINARY\" --print \"require('path').dirname(require.resolve('react-native/package.json')) + '/scripts/react-native-xcode.sh'\"`\n\n";
		};
		8EB5A1D52F22227800044D63 /* Generate dSYMs for React Native frameworks */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Generate dSYMs for React Native frameworks";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n\n# Generate dSYMs for React Native frameworks (Release builds only)\nif [[ \"$CONFIGURATION\" == *Release* ]]; then\n  # Ensure dSYM folder exists\n  mkdir -p \"$DWARF_DSYM_FOLDER_PATH\"\n  \n  echo \"📦 Generating dSYMs for React Native frameworks...\"\n  echo \"Configuration: $CONFIGURATION\"\n  echo \"dSYM folder: $DWARF_DSYM_FOLDER_PATH\"\n  \n  # Helper function to generate dSYM\n  generate_dsym() {\n    local framework_path=\"$1\"\n    local dsym_name=\"$2\"\n    \n    if [ ! -f \"$framework_path\" ]; then\n      echo \"⚠️  Framework binary not found: $framework_path\"\n      return 1\n    fi\n    \n    echo \"Generating dSYM for $dsym_name...\"\n    \n    # Generate dSYM and suppress warnings (prebuilt frameworks may not have source files)\n    /usr/bin/dsymutil \"$framework_path\" -o \"$DWARF_DSYM_FOLDER_PATH/$dsym_name.dSYM\" 2>&1 | grep -v \"unable to open object file\" | grep -v \"no debug symbols\" || true\n    \n    if [ -d \"$DWARF_DSYM_FOLDER_PATH/$dsym_name.dSYM\" ]; then\n      echo \"✅ $dsym_name.dSYM created successfully\"\n      return 0\n    else\n      echo \"❌ Failed to create $dsym_name.dSYM\"\n      return 1\n    fi\n  }\n  \n  # Determine framework paths based on build type\n  if [ -n \"${ARCHIVE_PRODUCTS_PATH:-}\" ]; then\n    # Archive build - frameworks are in Products/Applications/awallet.app/Frameworks\n    APP_FRAMEWORKS=\"${ARCHIVE_PRODUCTS_PATH}/Applications/${WRAPPER_NAME:-awallet.app}/Frameworks\"\n    echo \"Archive build detected. Frameworks location: $APP_FRAMEWORKS\"\n  else\n    # Regular build\n    APP_FRAMEWORKS=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\n    echo \"Regular build detected. Frameworks location: $APP_FRAMEWORKS\"\n  fi\n  \n  # Generate dSYMs for each framework\n  REACT_FRAMEWORK=\"${APP_FRAMEWORKS}/React.framework/React\"\n  if [ -f \"$REACT_FRAMEWORK\" ]; then\n    generate_dsym \"$REACT_FRAMEWORK\" \"React.framework\" || true\n  else\n    echo \"⚠️  React.framework not found at $REACT_FRAMEWORK\"\n    REACT_SEARCH=$(find \"${ARCHIVE_PRODUCTS_PATH:-${TARGET_BUILD_DIR}}\" -name \"React\" -path \"*/React.framework/React\" 2>/dev/null | head -1)\n    if [ -n \"$REACT_SEARCH\" ]; then\n      echo \"Found React.framework at: $REACT_SEARCH\"\n      generate_dsym \"$REACT_SEARCH\" \"React.framework\" || true\n    fi\n  fi\n  \n  RND_FRAMEWORK=\"${APP_FRAMEWORKS}/ReactNativeDependencies.framework/ReactNativeDependencies\"\n  if [ -f \"$RND_FRAMEWORK\" ]; then\n    generate_dsym \"$RND_FRAMEWORK\" \"ReactNativeDependencies.framework\" || true\n  else\n    echo \"⚠️  ReactNativeDependencies.framework not found at $RND_FRAMEWORK\"\n    RND_SEARCH=$(find \"${ARCHIVE_PRODUCTS_PATH:-${TARGET_BUILD_DIR}}\" -name \"ReactNativeDependencies\" -path \"*/ReactNativeDependencies.framework/ReactNativeDependencies\" 2>/dev/null | head -1)\n    if [ -n \"$RND_SEARCH\" ]; then\n      echo \"Found ReactNativeDependencies.framework at: $RND_SEARCH\"\n      generate_dsym \"$RND_SEARCH\" \"ReactNativeDependencies.framework\" || true\n    fi\n  fi\n  \n  HERMES_FRAMEWORK=\"${APP_FRAMEWORKS}/hermes.framework/hermes\"\n  if [ -f \"$HERMES_FRAMEWORK\" ]; then\n    generate_dsym \"$HERMES_FRAMEWORK\" \"hermes.framework\" || true\n  else\n    echo \"⚠️  hermes.framework not found at $HERMES_FRAMEWORK\"\n    HERMES_SEARCH=$(find \"${ARCHIVE_PRODUCTS_PATH:-${TARGET_BUILD_DIR}}\" -name \"hermes\" -path \"*/hermes.framework/hermes\" 2>/dev/null | head -1)\n    if [ -n \"$HERMES_SEARCH\" ]; then\n      echo \"Found hermes.framework at: $HERMES_SEARCH\"\n      generate_dsym \"$HERMES_SEARCH\" \"hermes.framework\" || true\n    fi\n  fi\n  \n  echo \"📋 dSYM generation complete\"\n  if [ -d \"$DWARF_DSYM_FOLDER_PATH\" ]; then\n    echo \"Generated dSYMs:\"\n    ls -la \"$DWARF_DSYM_FOLDER_PATH\" | grep -E \"\\.dSYM\" || echo \"No dSYM files found\"\n  fi\nfi\n";
		};
