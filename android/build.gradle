// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply from: new File(rootDir, 'node-path.gradle')

ext {
    awalletNodeExecutable = gradle.ext.awalletNodeExecutable
    REACT_NATIVE_NODE_MODULES_DIR = new File(rootDir, '../node_modules/react-native').absolutePath
    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = new File(rootDir, '../node_modules/react-native-worklets').absolutePath
}

gradle.projectsLoaded {
    def appProject = rootProject.findProject(':app')
    if (appProject != null) {
        appProject.ext.REACT_NATIVE_NODE_MODULES_DIR = rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR
        appProject.ext.REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = rootProject.ext.REACT_NATIVE_WORKLETS_NODE_MODULES_DIR
    }
}

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
