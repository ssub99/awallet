<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>알림 수신 → 기록 생성 모션</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽에 375x812 폰 프레임(올려준 화면 그대로), 오른쪽에 재생·타임라인·타이밍 컨트롤·모션 스펙. 좁은 화면에서는 세로로 쌓임 */
:root {
  --bg: #F1F3F8; --surface: #FFFFFF; --fg: #161A24; --muted: #667085; --line: #DCE1EB;
  --accent: #3560D4; --accent-fg: #FFFFFF; --track: #E7EAF2;
  --seg-dark: #4A4D55; --seg-red: #E5484D; --seg-green: #1BC673; --seg-gray: #9AA0AE; --on-seg: #FFFFFF; --on-green: #05301B;
  --font-body: "Inter", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1118; --surface: #171B25; --fg: #E9ECF3; --muted: #98A0B3; --line: #2B3140;
    --accent: #7C9BF2; --accent-fg: #0E1118; --track: #262B38; --seg-dark: #8A8F9C; --seg-gray: #6B7283; --on-seg: #0E1118;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1118; --surface: #171B25; --fg: #E9ECF3; --muted: #98A0B3; --line: #2B3140;
  --accent: #7C9BF2; --accent-fg: #0E1118; --track: #262B38; --seg-dark: #8A8F9C; --seg-gray: #6B7283; --on-seg: #0E1118;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  padding-block: 28px 44px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; }
.top { margin-bottom: 28px; }
h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 58ch; text-wrap: pretty; }
.layout { display: grid; grid-template-columns: minmax(0, 375px) minmax(0, 1fr); gap: 44px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 28px; } }

.stage { position: relative; width: 100%; max-width: 375px; height: 783px; margin-inline: auto; }
.phone { position: absolute; left: 0; top: 0; width: 375px; height: 783px; transform-origin: 0 0; background: #fff; border-radius: 40px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line), 0 24px 48px -24px rgba(20, 30, 60, 0.4); }
.phone svg { display: block; width: 375px; height: 783px; }

.panel { min-width: 0; }
.sec { padding-block: 22px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 0; }
.sec h2 { margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { appearance: none; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.step { font-weight: 500; padding: 8px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.scrub { margin-top: 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.scrub input { width: 100%; margin: 0; accent-color: var(--accent); }
.scrub output { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5ch; text-align: right; }

.tl { display: flex; gap: 12px; }
.tl-labels { display: flex; flex-direction: column; gap: 8px; width: 104px; flex: none; }
.tl-labels span { height: 28px; line-height: 28px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.tl-body { flex: 1; min-width: 0; }
.tracks { position: relative; display: flex; flex-direction: column; gap: 8px; }
.track { position: relative; height: 28px; border-radius: 6px; background: var(--track); overflow: hidden; }
.seg { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; font: 600 11px var(--font-mono); color: var(--on-seg); }
.seg.green { color: var(--on-green); }
.playhead { position: absolute; top: -4px; bottom: -4px; left: 0; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--fg); pointer-events: none; }
.axis { display: flex; justify-content: space-between; margin-top: 8px; font: 500 11px var(--font-mono); color: var(--muted); }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px 28px; }
.f { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: baseline; }
.f label { font-size: 14px; font-weight: 500; }
.f output { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.f input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
.f.wide { grid-column: 1 / -1; }
.f select { grid-column: 1 / -1; width: 100%; font: inherit; font-size: 14px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.spec { margin: 0; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 12.5px/1.75 var(--font-mono); white-space: pre; overflow-x: auto; }
.spec-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>알림 수신 → 기록 생성 모션</h1>
    <p class="lede">알림 카드가 뜨면서 기록 수신함 칩에 badge가 붙고, 수신함에서 '추가'를 누르면 인디케이터가 돌아요. 생성이 끝나면 간편 입력 화면으로 돌아와 토스트가 떠요. 컨트롤로 타이밍을 바꿔가며 확인해 보세요.</p>
  </header>

  <div class="layout">
    <div class="stage" id="stage"><div class="phone" id="phone"></div></div>

    <div class="panel">
      <section class="sec">
        <h2>재생</h2>
        <div class="btns">
          <button class="btn primary" id="replay" type="button">처음부터 재생</button>
          <button class="btn" id="pp" type="button">일시정지</button>
        </div>
        <div class="btns" style="margin-top:8px" id="steps"></div>
        <div class="scrub"><input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="재생 위치"><output id="scrubV">0ms</output></div>
        <p class="hint">화면이 열리면 한 번 자동으로 재생돼요. 단계 버튼은 해당 단계 직전부터 다시 재생하고, 슬라이더로 프레임 단위로 넘겨볼 수 있어요.</p>
      </section>

      <section class="sec">
        <h2>타임라인</h2>
        <div class="tl">
          <div class="tl-labels" id="tlLabels"></div>
          <div class="tl-body">
            <div class="tracks" id="tracks"></div>
            <div class="axis"><span>0ms</span><span id="axisEnd">0ms</span></div>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2>타이밍</h2>
        <div class="fields">
          <div class="f"><label for="startDelay">알림 카드 등장</label><output id="startDelayV"></output>
            <input type="range" id="startDelay" min="0" max="2000" step="50" value="600"></div>
          <div class="f"><label for="notifHold">알림 카드 노출 유지</label><output id="notifHoldV"></output>
            <input type="range" id="notifHold" min="300" max="3000" step="100" value="1500"></div>
          <div class="f"><label for="nav">화면 전환 시간</label><output id="navV"></output>
            <input type="range" id="nav" min="200" max="800" step="50" value="350"></div>
          <div class="f"><label for="inboxHold">수신함에서 추가 누르기까지</label><output id="inboxHoldV"></output>
            <input type="range" id="inboxHold" min="300" max="2500" step="100" value="900"></div>
          <div class="f"><label for="load">인디케이터 시간</label><output id="loadV"></output>
            <input type="range" id="load" min="600" max="3000" step="100" value="1500"></div>
          <div class="f"><label for="spin">인디케이터 1회전</label><output id="spinV"></output>
            <input type="range" id="spin" min="600" max="1600" step="100" value="1000"></div>
          <div class="f"><label for="toastHold">토스트 유지</label><output id="toastHoldV"></output>
            <input type="range" id="toastHold" min="1000" max="4000" step="250" value="2000"></div>
          <div class="f wide"><label for="ease">화면 전환(키보드) 이징</label><span></span>
            <select id="ease">
              <option value="inout">ease-in-out (기본)</option>
              <option value="smooth">ease-in-out (더 부드럽게)</option>
              <option value="out">ease-out</option>
            </select></div>
        </div>
      </section>

      <section class="sec">
        <h2>모션 스펙</h2>
        <pre class="spec" id="spec"></pre>
        <div class="spec-row">
          <button class="btn" id="copy" type="button">스펙 복사</button>
          <span class="note" id="copyNote" aria-live="polite"></span>
        </div>
      </section>
    </div>
  </div>
</div>

<script>/* 알림 수신 → 기록 생성 모션: 타임라인/트랙 정의 (HTML 플레이어와 Lottie 변환이 같은 코드를 공유) */
(function (root) {
  var EASE = {
    out:    [0.215, 0.61, 0.355, 1],   // 등장
    'in':   [0.645, 0, 0.785, 0.39],   // 퇴장
    inout:  [0.42, 0, 0.58, 1],
    smooth: [0.65, 0, 0.35, 1],
    linear: [0, 0, 1, 1]
  };
  var DEFAULTS = {
    startDelay: 600,   // 알림 카드/배지 등장 시점
    notifIn: 300,      // 알림 카드 등장 시간
    notifHold: 1500,   // 알림 카드 노출 유지
    nav: 350,          // 화면 전환 시간 (수신함 진입 / 간편 입력 복귀)
    inboxHold: 900,    // 수신함 도착 후 '추가' 누르기 전
    press: 160,        // 추가 버튼 눌림
    load: 1500,        // 인디케이터 회전 시간
    toastDelay: 150,   // 복귀 후 토스트까지
    toastIn: 300,
    toastHold: 2000,
    toastOut: 250,
    spin: 1000,        // 인디케이터 1회전 시간
    ease: 'inout',     // 화면 전환(키보드) 이징
    tail: 400
  };

  function plan(P) {
    var t = {};
    t.t0 = P.startDelay;
    t.tN = t.t0 + P.notifIn;
    t.t1 = t.tN + P.notifHold;
    t.t1e = t.t1 + P.nav;
    t.t1ee = t.t1e + 180;                    // 카드 stagger 끝
    t.tPress = t.t1e + P.inboxHold;
    t.tLoad = t.tPress + P.press;
    t.tDone = t.tLoad + P.load;
    t.tDoneE = t.tDone + P.nav;
    t.tToast = t.tDoneE + P.toastDelay;
    t.tToastIn = t.tToast + P.toastIn;
    t.tToastOut = t.tToastIn + P.toastHold;
    t.tToastEnd = t.tToastOut + P.toastOut;
    t.total = t.tToastEnd + P.tail;
    t.fo = Math.min(200, P.nav);              // 칩/입력창 페이드아웃
    t.exit = Math.round(P.nav * 0.8);         // 수신함 카드 퇴장
    return t;
  }

  function Seq(v0) { this.k = [{ t: 0, v: v0, e: 'hold' }]; this.cur = v0; }
  Seq.prototype.to = function (t0, t1, v, e) {
    var last = this.k[this.k.length - 1];
    if (t0 > last.t) this.k.push({ t: t0, v: this.cur, e: e });
    else if (t0 === last.t) last.e = e;
    else throw new Error('seq order ' + t0 + ' < ' + last.t);
    this.k.push({ t: t1, v: v, e: 'hold' });
    this.cur = v; return this;
  };
  Seq.prototype.set = function (t, v) {
    var last = this.k[this.k.length - 1];
    if (t <= last.t) throw new Error('seq set order ' + t + ' <= ' + last.t);
    this.k.push({ t: t, v: v, e: 'hold' }); this.cur = v; return this;
  };

  function tracks(P) {
    var t = plan(P), E = P.ease, out = {};
    var S = function (k, seq) { out[k] = seq.k; };
    var round = Math.round;

    // 키보드: 수신함으로 갈 때 내려가고, 복귀할 때 올라옴
    S('keyboard.y', new Seq(0).to(t.t1, t.t1e, 292, E).to(t.tDone, t.tDoneE, 0, E));

    // 칩 / 입력창: 알림이 오면 칩 2·3이 26px 밀리고 배지가 팝. 수신함 이동 때 페이드아웃, 복귀 때 원상태로 페이드인
    ['input-row', 'chip1', 'chip2', 'chip3'].forEach(function (n) {
      S(n + '.o', new Seq(100).to(t.t1, t.t1 + t.fo, 0, 'out').to(t.tDone + 120, t.tDoneE, 100, 'out'));
    });
    S('chip1.w', new Seq(120).to(t.t0, t.t0 + 300, 146, 'out').set(t.t1 + t.fo, 120));
    S('chip2.x', new Seq(0).to(t.t0, t.t0 + 300, 26, 'out').set(t.t1 + t.fo, 0));
    S('chip3.x', new Seq(0).to(t.t0, t.t0 + 300, 26, 'out').set(t.t1 + t.fo, 0));
    S('badge.o', new Seq(0).to(t.t0, t.t0 + 120, 100, 'out').to(t.t1, t.t1 + t.fo, 0, 'out'));
    S('badge.sx', new Seq(0).to(t.t0, t.t0 + 180, 115, 'out').to(t.t0 + 180, t.t0 + 300, 100, 'inout').set(t.t1 + t.fo, 0));

    // 헤더 오버레이

    // 알림 카드
    S('notif.o', new Seq(0).to(t.t0, t.tN, 100, 'out').to(t.t1, t.t1 + 200, 0, 'in'));
    S('notif.y', new Seq(-16).to(t.t0, t.tN, 0, 'out').to(t.t1, t.t1 + 200, -8, 'in'));

    // 수신함 카드들 (stagger)
    var cards = [
      ['sms', -16, 80], ['rec', 16, 120], ['stack-1', 16, 150], ['stack-2', 16, 180], ['pager', 16, 140],
      ['btn-add', 16, 120], ['btn-add-label', 16, 120], ['btn-cancel', 16, 120], ['btn-cancel-dis', 16, 120], ['spinner', 16, 120]
    ];
    cards.forEach(function (c) {
      var n = c[0], dy = c[1], d = c[2], exitY = dy > 0 ? 12 : -12, fade = round(P.nav * 0.6);
      var y = new Seq(dy).to(t.t1 + d, t.t1e + d, 0, 'out').to(t.tDone, t.tDone + t.exit, exitY, 'in');
      S(n + '.y', y);
      if (n === 'btn-add-label') {
        S(n + '.o', new Seq(0).to(t.t1 + d, t.t1 + d + fade, 100, 'out').to(t.tLoad, t.tLoad + 120, 0, 'out'));
      } else if (n === 'btn-cancel') {
        S(n + '.o', new Seq(0).to(t.t1 + d, t.t1 + d + fade, 100, 'out').to(t.tLoad, t.tLoad + 120, 0, 'out'));
      } else if (n === 'btn-cancel-dis') {
        S(n + '.o', new Seq(0).to(t.tLoad, t.tLoad + 120, 100, 'out').to(t.tDone, t.tDone + t.exit, 0, 'in'));
      } else if (n === 'spinner') {
        S(n + '.o', new Seq(0).to(t.tLoad, t.tLoad + 120, 100, 'out').to(t.tDone, t.tDone + t.exit, 0, 'in'));
      } else if (n === 'stack-1' || n === 'stack-2') {
        // 시안 4번(로딩)에서는 뒤쪽 카드 스택이 사라진 상태
        S(n + '.o', new Seq(0).to(t.t1 + d, t.t1 + d + fade, 100, 'out').to(t.tLoad, t.tLoad + 120, 0, 'out'));
      } else {
        S(n + '.o', new Seq(0).to(t.t1 + d, t.t1 + d + fade, 100, 'out').to(t.tDone, t.tDone + t.exit, 0, 'in'));
      }
    });
    // 추가 버튼 눌림
    var press = function () { return new Seq(100).to(t.tPress, t.tPress + round(P.press / 2), 96, 'out').to(t.tLoad, t.tLoad + 100, 100, 'out'); };
    S('btn-add.sx', press()); S('btn-add-label.sx', press());
    // 인디케이터 회전 (12스텝)
    var step = P.spin / 12, rot = [{ t: 0, v: 0, e: 'hold' }], n = Math.floor(P.load / step) + 1;
    for (var i = 0; i < n; i++) rot.push({ t: round(t.tLoad + i * step), v: i * 30, e: 'hold' });
    rot[1].t = t.tLoad; // 첫 스텝은 시작 시점
    out['spinner.rot'] = rot;

    // 토스트
    S('toast.o', new Seq(0).to(t.tToast, t.tToastIn, 100, 'out').to(t.tToastOut, t.tToastEnd, 0, 'in'));
    S('toast.y', new Seq(-12).to(t.tToast, t.tToastIn, 0, 'out').to(t.tToastOut, t.tToastEnd, -12, 'in'));
    return out;
  }

  function markers(P) {
    var t = plan(P);
    return [
      { t: t.t0, dr: P.notifIn, cm: 'step1.알림 카드 노출' },
      { t: t.t0, dr: 300, cm: 'step2.기록 수신함 칩 badge' },
      { t: t.t1, dr: P.nav, cm: 'step3.기록 수신함 이동' },
      { t: t.tPress, dr: P.press + P.load, cm: 'step4.추가 → 인디케이터' },
      { t: t.tLoad, dr: P.load, cm: 'step5.취소 disabled' },
      { t: t.tDone, dr: P.nav, cm: 'step6.간편 입력 복귀' },
      { t: t.tToast, dr: P.toastIn + P.toastHold + P.toastOut, cm: 'step6.토스트' }
    ];
  }

  root.MOTION = { EASE: EASE, DEFAULTS: DEFAULTS, plan: plan, tracks: tracks, markers: markers };
})(typeof window !== 'undefined' ? window : module.exports);

      ['2.badge.pop', '300ms  scale 0 → 115 → 100  (알림과 동시)'],
      ['2.chip.shift', '300ms  ' + bz('out') + '  ·  칩 +26px'],
      ['3.nav.in', P.nav + 'ms  알림 퇴장 200ms ' + bz('in')],
      ['3.nav.cards', 'y ±16 → 0  ·  opacity 0 → 100  ·  delay 80~180ms'],
      ['3.chips', 'fade out 200ms  (알림 퇴장과 동시)'],
      ['3.keyboard', 'y 0 → 292  ' + bz(P.ease)],
      ['4.press', '160ms  scale 100 → 96 → 100'],
      ['4.stack', '뒤쪽 카드 스택 fade out 120ms (시안 4번)'],
      ['4.indicator', P.load + 'ms  12-spoke  ' + P.spin + 'ms / 회전'],
      ['5.cancel', 'disabled  120ms fade  #F4F5F6 → #F1F2F3'],
      ['5.cancel.label', '#424242 → #BDBDBD'],
      ['6.nav.out', P.nav + 'ms  카드 퇴장 ' + PL.exit + 'ms ' + bz('in')],
      ['6.keyboard', 'y 292 → 0  ' + bz(P.ease)],
      ['6.chips', 'fade in  +120ms 지연  ·  badge 없는 원상태'],
      ['6.toast.delay', 'nav + ' + P.toastDelay + 'ms'],
      ['6.toast.in', P.toastIn + 'ms  ' + bz('out') + '  y -12 → 0'],
      ['6.toast.hold', P.toastHold + 'ms'],
      ['6.toast.out', P.toastOut + 'ms  fade  y 0 → -12']
    ];
    $('spec').textContent = rows.map(function (r) { return r[0] + new Array(Math.max(1, 18 - r[0].length) + 1).join(' ') + r[1]; }).join('\n');
  }

  /* ---------- 재생 ---------- */
  var st = { t: 0, playing: false, last: 0 };
  var raf = 0;
  function rebuild() { PL = M.plan(P); TR = M.tracks(P); viz(); spec(); render(st.t); updateScrub(); }
  function updateScrub() { $('scrub').value = Math.round(st.t); $('scrubV').textContent = Math.round(Math.min(st.t, PL.total)) + 'ms'; }
  function loop(now) {
    if (!st.playing) return;
    st.t += now - st.last; st.last = now;
    if (st.t >= PL.total) { st.t = PL.total; st.playing = false; $('pp').textContent = '재생'; }
    render(st.t); updateScrub();
    if (st.playing) raf = requestAnimationFrame(loop);
  }
  function play(from) {
    cancelAnimationFrame(raf);
    st.t = Math.max(0, from || 0); st.playing = true; st.last = performance.now(); $('pp').textContent = '일시정지';
    render(st.t); raf = requestAnimationFrame(loop);
  }
  function pause() { st.playing = false; cancelAnimationFrame(raf); $('pp').textContent = '재생'; }
  $('replay').addEventListener('click', function () { play(0); });
  $('pp').addEventListener('click', function () {
    if (st.playing) pause(); else { if (st.t >= PL.total) st.t = 0; st.playing = true; st.last = performance.now(); $('pp').textContent = '일시정지'; raf = requestAnimationFrame(loop); }
  });
  $('scrub').addEventListener('input', function () { pause(); st.t = +$('scrub').value; render(st.t); $('scrubV').textContent = Math.round(st.t) + 'ms'; });

  var STEPS = [
    ['1 알림 카드', function () { return PL.t0 - 250; }], ['2 배지', function () { return PL.t0 - 250; }], ['3 수신함 이동', function () { return PL.t1 - 250; }],
    ['4 인디케이터', function () { return PL.tPress - 250; }], ['5 취소 disabled', function () { return PL.tPress - 250; }], ['6 복귀 + 토스트', function () { return PL.tDone - 250; }]
  ];
  $('steps').innerHTML = STEPS.map(function (s, i) { return '<button class="btn step" type="button" data-i="' + i + '">' + s[0] + '</button>'; }).join('');
  $('steps').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) play(Math.max(0, STEPS[+b.dataset.i][1]())); });

  ['startDelay', 'notifHold', 'nav', 'inboxHold', 'load', 'spin', 'toastHold', 'ease'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      P[id] = id === 'ease' ? $(id).value : +$(id).value;
      if (id !== 'ease') $(id + 'V').textContent = $(id).value + 'ms';
      rebuild();
    });
    if (id !== 'ease') $(id + 'V').textContent = $(id).value + 'ms';
  });
  $('copy').addEventListener('click', function () {
    var note = $('copyNote'), sp = $('spec');
    function fallback() { var rg = document.createRange(); rg.selectNodeContents(sp); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); note.textContent = '선택했어요. 직접 복사해 주세요.'; }
    try { navigator.clipboard.writeText(sp.textContent).then(function () { note.textContent = '복사했어요.'; }, fallback); } catch (e) { fallback(); }
  });

  /* ---------- 폰 크기 맞춤 ---------- */
  var stage = $('stage'), phone = $('phone');
  function fit() { var s = Math.min(1, stage.clientWidth / 375); phone.style.transform = 'scale(' + s + ')'; stage.style.height = (SCENE.h * s) + 'px'; }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit); fit();

  /* ---------- 시작 ---------- */
  window.__seek = function (ms) { pause(); st.t = ms; render(ms); updateScrub(); };
  rebuild();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) setTimeout(function () { play(0); }, 500);
})();
</script>
</body>
