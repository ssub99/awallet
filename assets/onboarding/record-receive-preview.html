<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><title>알림 수신 → 기록 Lottie</title>
<style>html,body{margin:0;background:#e8e8e8;font:14px/1.4 sans-serif}.wrap{display:flex;gap:24px;padding:24px}.phone{width:375px;height:783px;border:10px solid #3B3B3B;border-radius:50px;overflow:hidden;background:#111}#lottie{width:375px;height:783px}.note{color:#555}</style></head>
<body><div class="wrap"><div class="phone"><div id="lottie"></div></div><p class="note">알림 수신 → 기록 Lottie<br/><code>record-receive-flow.json</code> · 375×783</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>fetch('./record-receive-flow.json').then(r=>r.json()).then(data=>lottie.loadAnimation({container:document.getElementById('lottie'),renderer:'svg',loop:true,autoplay:true,animationData:data}));</script>
</body></html>
